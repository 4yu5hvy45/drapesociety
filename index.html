<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Drape Society Rack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen storefront. Header / chrome rail with hanging pieces / caption / slogan ticker.
   Single committed look taken from drapesociety.com: packshot grey ground, near-black ink. */
:root{
  --ground:#efefef;      /* same grey as their packshots, so cutouts sit seamlessly */
  --ink:#0b0b0a;
  --ink-soft:#5f5d5a;
  --line:#d6d4d0;
  --paper:#ffffff;
  --signal:#b00317;      /* ringer-tee red, used once: the sale dot */
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --g:clamp(130px,18vw,320px);           /* garment width on the rail */
  --fw:min(44vh,32vw,460px);             /* garment width in focus view */
  --hook:-0.1645;                        /* rod centre, as a fraction of garment width above its top edge */
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.42,.5,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto}

/* masthead: nav left, animated logo centre, cart right */
.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-block:16px 2px;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.nav-l{justify-self:start;display:flex;gap:24px;font-size:12px;font-weight:500;letter-spacing:.02em}
.nav-l a{color:var(--ink-soft);text-decoration:none}
.nav-l a:hover,.nav-l a:focus-visible{color:var(--ink)}
.cart{justify-self:end;font-family:var(--mono);font-size:12px;color:var(--ink)}
.mark{display:grid;justify-items:center;gap:8px;text-decoration:none;color:var(--ink);outline:none}
.mark:focus-visible .logo{outline:2px solid var(--ink);outline-offset:6px}
.logo{display:block;height:clamp(40px,6.4vh,66px);width:auto;overflow:visible}
.logo .ink{fill:var(--ink)}
.word{transform-box:fill-box;transform-origin:0% 50%;animation:wordIn 1.15s cubic-bezier(.2,.9,.25,1.12) .32s both}
@keyframes wordIn{0%{opacity:0;transform:translateX(-38px) skewX(-22deg) scaleX(1.12)}45%{opacity:1}100%{opacity:1;transform:none}}
.streaks rect{fill:var(--ink);opacity:0}
.streaks.go rect{animation:streak .78s cubic-bezier(.55,0,.25,1) both}
.streaks.go rect:nth-child(2){animation-delay:.07s}.streaks.go rect:nth-child(3){animation-delay:.13s}
.streaks.go rect:nth-child(4){animation-delay:.04s}.streaks.go rect:nth-child(5){animation-delay:.18s}
@keyframes streak{0%{opacity:0;transform:translateX(0) scaleX(.15)}25%{opacity:.9}100%{opacity:0;transform:translateX(340px) scaleX(1)}}
.sheen{animation:sheen 6.5s cubic-bezier(.45,0,.2,1) 1.7s infinite}
@keyframes sheen{0%{transform:translateX(0) skewX(-28deg)}24%{transform:translateX(330px) skewX(-28deg)}100%{transform:translateX(330px) skewX(-28deg)}}
.tagline{display:block;height:14px;overflow:hidden;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.tagline span{display:block;line-height:14px;transition:transform .45s var(--ease),opacity .45s var(--ease);animation:tagIn .7s var(--ease) 1.1s both}
@keyframes tagIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
.tagline span.out{transform:translateY(-100%);opacity:0}
.tagline span.pre{transform:translateY(100%);opacity:0;transition:none}

/* garment + hanger building block (used on the rail and in focus) */
.hanger{position:absolute;left:0;width:100%;height:auto;top:calc(var(--w)*-.2);overflow:visible;z-index:0;pointer-events:none}
.cloth{position:relative;z-index:1}
.cloth img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.11)) drop-shadow(0 2px 3px rgba(0,0,0,.08))}
/* fabric resting on the hanger: contact shadow under the collar, soft fold shading at the edges */
.shade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:
    radial-gradient(34% 7% at 50% 1.5%,rgba(40,25,15,.30),rgba(40,25,15,0) 72%),
    radial-gradient(22% 16% at 31% 6%,rgba(0,0,0,.10),rgba(0,0,0,0) 70%),
    radial-gradient(22% 16% at 69% 6%,rgba(0,0,0,.10),rgba(0,0,0,0) 70%),
    linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 78%,rgba(0,0,0,.06)),
    linear-gradient(90deg,rgba(0,0,0,.07),rgba(0,0,0,0) 13%,rgba(0,0,0,0) 87%,rgba(0,0,0,.07))}

/* rail */
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.rack{position:relative;padding-top:calc(var(--g)*.24);transition:filter .5s var(--ease),opacity .5s var(--ease),transform .6s var(--ease)}
.rod{position:absolute;left:-70px;right:-70px;height:calc(var(--g)*.027);border-radius:99px;
  top:calc(var(--g)*.24 + var(--g)*var(--hook) - var(--g)*.0135);
  background:linear-gradient(180deg,#fbfbfa 0%,#d2d1ce 30%,#8f8e8b 65%,#c9c8c5 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.12)}
.rod::before,.rod::after{content:"";position:absolute;top:-5px;bottom:-5px;width:10px;border-radius:3px;background:linear-gradient(90deg,#8e8d8a,#ecebe8,#8e8d8a)}
.rod::before{left:-6px}.rod::after{right:-6px}
.items{display:flex;align-items:flex-start;position:relative}
.item{--w:var(--g);position:relative;flex:none;width:calc(var(--g)*.42);min-width:calc(var(--g)*.42);height:calc(var(--g)*.98);
  transition:width .55s var(--ease),min-width .55s var(--ease);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.item.hot{width:calc(var(--g)*1.5);min-width:calc(var(--g)*1.5)}
.swing{pointer-events:none;position:absolute;left:50%;top:0;width:var(--g);margin-left:calc(var(--g)/-2);
  transform-origin:50% calc(var(--g)*var(--hook));perspective:1100px;will-change:transform}
.twist{transform-origin:50% calc(var(--g)*var(--hook));transform-style:preserve-3d;will-change:transform}
.plane{position:relative;transform-origin:50% calc(var(--g)*var(--hook));transform:rotateY(-64deg) scale(.96);
  transition:transform .65s var(--spring),filter .4s var(--ease)}
.item:nth-child(even) .plane{transform:rotateY(-60deg) scale(.96)}
.item.hot .plane{transform:rotateY(0) scale(1.28)}
.item.dim .plane{filter:brightness(.97) saturate(.9)}
.item.rip .cloth{filter:url(#clothR)}
.item:focus-visible .plane{outline:2px solid var(--ink);outline-offset:6px}

/* caption under the rail */
.caption{display:grid;justify-items:center;gap:14px;padding-block:6px 26px;min-height:96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .4s var(--ease)}
.caption .name{font-size:13px;color:var(--ink-soft);min-height:1.3em}
.caption .name b{color:var(--ink);font-weight:500}
.pill{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:9px 20px;font:500 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.pill:hover,.pill:focus-visible{background:var(--ink);color:var(--ground)}

/* ticker */
.ticker{background:var(--ink);color:var(--ground);overflow:hidden;padding-block:11px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))}
.track{display:flex;width:max-content;animation:tick 38s linear infinite}
.track span{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding-right:28px;display:inline-flex;align-items:center;gap:28px}
.track span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ground)}
.track span.red::after{background:var(--signal)}
@keyframes tick{to{transform:translateX(-50%)}}

/* focus view */
.app.focused .rack{filter:blur(9px);opacity:.42;transform:scale(.98)}
.app.focused .caption{opacity:0;pointer-events:none}
.focus{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding-top:calc(var(--fw)*.2)}
.app.focused .focus{pointer-events:auto}
.f-wrap{display:grid;justify-items:center;position:relative}
.f-piece{--w:var(--fw);position:relative;width:var(--fw);transform-origin:0 0}
.f-swing,.f-tilt{transform-origin:50% calc(var(--fw)*var(--hook));will-change:transform}
.f-swing{perspective:1300px}
.f-tilt{position:relative;transform-style:preserve-3d}
.f-flip{position:relative;transform-style:preserve-3d;transition:transform .85s var(--ease);transform-origin:50% 50%}
.f-flip.back{transform:rotateY(180deg)}
.face{position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.rear{position:absolute;inset:0;transform:rotateY(180deg)}
.face.rear .cloth img{transform:scaleX(-1)}
.face.rear .shade{transform:scaleX(-1)}
.f-piece .cloth img{filter:drop-shadow(0 20px 24px rgba(0,0,0,.13)) drop-shadow(0 3px 4px rgba(0,0,0,.08))}
.f-piece.rip .cloth{filter:url(#clothF)}
.wipe{position:absolute;left:0;top:0;width:100%;z-index:3;pointer-events:none;clip-path:inset(0 0 100% 0)}
.wipe.run{transition:clip-path .75s cubic-bezier(.65,0,.25,1);clip-path:inset(0 0 0 0)}
.wipe.mirror .cloth img,.wipe.mirror .shade{transform:scaleX(-1)}
.tags{position:absolute;left:100%;top:calc(var(--fw)*-.06);display:flex;gap:10px;margin-left:22px}
.tags.mobile{display:none}
.tag{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;transform-origin:50% 0;transition:transform .45s var(--spring)}
.tag::before{content:"";width:1px;height:var(--str,34px);background:#8b8984}
.tag i{display:grid;place-items:center;width:30px;height:66px;border-radius:3px 3px 4px 4px;background:var(--c);position:relative;
  box-shadow:0 6px 10px rgba(0,0,0,.12),inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.tag i::before{content:"";position:absolute;top:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ground);box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.tag i::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--trim,transparent)}
.tag em{font-style:normal;font:600 8px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--t);margin-top:10px}
.tag:hover,.tag:focus-visible{transform:rotate(-5deg)}
.tag.on{transform:translateY(-6px)}
.tag.on i{box-shadow:0 10px 16px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.08),0 0 0 2px var(--ground),0 0 0 3px var(--ink)}
.tag:focus-visible{outline:none}.tag:focus-visible i{outline:2px solid var(--ink);outline-offset:3px}
.tags.jolt .tag{animation:jolt .9s var(--ease) both}
.tags.jolt .tag:nth-child(2){animation-delay:.04s}.tags.jolt .tag:nth-child(3){animation-delay:.08s}
.tags.jolt .tag:nth-child(4){animation-delay:.12s}.tags.jolt .tag:nth-child(5){animation-delay:.16s}
@keyframes jolt{0%{rotate:0deg}20%{rotate:9deg}45%{rotate:-6deg}68%{rotate:3deg}85%{rotate:-1deg}100%{rotate:0deg}}
.f-info{display:grid;justify-items:center;gap:12px;margin-top:22px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease) .25s,transform .45s var(--ease) .25s}
.app.focused .f-info{opacity:1;transform:none}
.f-title{font-family:var(--display);font-stretch:125%;font-weight:850;font-size:clamp(15px,1.55vw,22px);letter-spacing:.01em;text-transform:uppercase;margin:0;text-align:center;text-wrap:balance}
.f-price{font-family:var(--mono);font-size:12px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.f-price s{color:var(--ink-soft)}
.f-price .off{color:var(--signal)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.shop{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
.close{position:absolute;top:18px;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));appearance:none;border:1px solid var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;font:400 18px/1 var(--body);color:var(--ink);opacity:0;transition:opacity .3s}
.app.focused .close{opacity:1}

@media (max-width:760px){
  .nav-l a{display:none}
  .masthead{grid-template-columns:1fr auto 1fr;gap:12px}
  .logo{height:38px}
  :root{--g:clamp(96px,26vw,150px);--fw:min(52vw,250px)}
  .stage{place-items:center start;overflow-x:auto;overflow-y:hidden}
  .rack{margin-inline:70px}
  .tags{display:none}
  .tags.mobile{display:flex;position:static;margin:18px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
const FAM={
  raglan:{price:"Rs. 1,299",was:"Rs. 1,899",off:"32% off",items:[
    {id:"raglan-black",name:"Black Raglan Long Sleeve",tag:"Black",c:"#1f1e23",t:"#efefef",url:"black-raglan-long-sleeve"},
    {id:"raglan-navy",name:"Navy Raglan Long Sleeve",tag:"Navy",c:"#202741",t:"#efefef",url:"navy-raglan-long-sleeve"},
    {id:"raglan-cream",name:"Cream Raglan Long Sleeve",tag:"Cream",c:"#eee9d6",t:"#3a3631",url:"cream-raglan-long-sleeve"},
    {id:"raglan-dark",name:"Dark Raglan Long Sleeve",tag:"Dark",c:"#4c3c3d",t:"#efefef",url:"dark-raglan-long-sleeve"},
    {id:"raglan-taupe",name:"Raglan Long Sleeve",tag:"Taupe",c:"#6b5c55",t:"#efefef",url:"raglan-long-sleeve"}]},
  ringer:{price:"Rs. 999",was:"Rs. 1,499",off:"33% off",items:[
    {id:"ringer-black",name:"Classic Black Ringer T-Shirt",tag:"Black",c:"#f4f3f6",trim:"#0a0a0a",t:"#0a0a0a",url:"classic-black-ringer-t-shirt"},
    {id:"ringer-redblack",name:"Classic Red & Black Ringer T-Shirt",tag:"Red/Blk",c:"#ae0115",trim:"#111",t:"#f4f3f6",url:"classic-red-black-ringer-t-shirt"},
    {id:"ringer-red",name:"Classic Red Ringer T-Shirt",tag:"Red",c:"#f4f3f6",trim:"#b00317",t:"#b00317",url:"classic-red-ringer-t-shirt"},
    {id:"ringer-sky",name:"Sky Blue Ringer T-Shirt",tag:"Sky",c:"#f4f3f6",trim:"#699bce",t:"#3f75ac",url:"sky-blue-ringer-t-shirt"}]}
};
const all={};for(const [f,d] of Object.entries(FAM))d.items.forEach(p=>{p.fam=f;all[p.id]=p});
const ORDER=["raglan-black","ringer-black","raglan-cream","ringer-redblack","raglan-navy","ringer-red","raglan-dark","ringer-sky","raglan-taupe"];
const src=id=>`${id}.webp`;
const $=s=>document.getElementById(s);
const app=$("app"),itemsEl=$("items"),hoverName=$("hoverName"),focus=$("focus"),fpiece=$("fpiece");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const HINT=matchMedia("(hover: none)").matches?"Tap a piece to try it on.":"Hover the rack. Click a piece to try it on.";
hoverName.textContent=HINT;
ORDER.forEach(id=>{const im=new Image();im.src=src(id)});
const setMask=(el,id)=>{const u=`url(${src(id)})`;el.style.webkitMaskImage=u;el.style.maskImage=u};
const HANGER=`<svg class="hanger" viewBox="0 -200 1000 340" aria-hidden="true"><use href="#hanger" x="0" y="-200" width="1000" height="340"/></svg>`;

/* ---------- rail ---------- */
ORDER.forEach(id=>{
  const p=all[id],d=document.createElement("div");
  d.className="item";d.tabIndex=0;d.dataset.id=id;d.setAttribute("role","button");d.setAttribute("aria-label",p.name);
  d.innerHTML=`<div class="swing"><div class="twist"><div class="plane">${HANGER}<div class="cloth"><img class="garment" src="${src(id)}" alt="" draggable="false"><div class="shade"></div></div></div></div></div>`;
  setMask(d.querySelector(".shade"),id);
  itemsEl.appendChild(d);
});
const items=[...itemsEl.children];
// per-piece pendulum state: a = swing angle (deg), t = twist around the hook (deg)
const phys=items.map((el,i)=>({el,sw:el.querySelector(".swing"),tw:el.querySelector(".twist"),a:0,v:0,t:0,tv:0,ph:i*1.37,ph2:i*2.11}));
let hot=null,current=null,isBack=false,busy=false,pendingClose=false;

function setHot(el){
  if(hot===el)return;
  items.forEach(x=>x.classList.toggle("hot",x===el));
  items.forEach(x=>x.classList.toggle("dim",!!el&&x!==el));
  hot=el;
  if(el){const p=all[el.dataset.id],f=FAM[p.fam];hoverName.innerHTML=`<b>${p.name}</b> — ${f.price}`;ripple(el,"R",9,900)}
  else hoverName.textContent=HINT;
}
items.forEach(el=>{
  el.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"&&!current)setHot(el)});
  el.addEventListener("focus",()=>{if(!current)setHot(el)});
  el.addEventListener("click",()=>openPiece(el));
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPiece(el)}});
});
itemsEl.addEventListener("pointerleave",()=>{if(!current)setHot(null)});
$("seeBtn").addEventListener("click",()=>openPiece(hot||items[4]));

/* cursor brushing through the rack: pieces near the pointer get pushed by its speed */
let lastX=null,lastT=0;
$("stage").addEventListener("pointermove",e=>{
  if(current||REDUCED){lastX=e.clientX;return}
  const now=performance.now();
  if(lastX!==null){
    const dt=Math.max(8,now-lastT),vx=(e.clientX-lastX)/dt; // px per ms
    const rr=$("rack").getBoundingClientRect();
    if(e.clientY>rr.top-20&&e.clientY<rr.bottom+20){
      phys.forEach(s=>{
        const r=s.el.getBoundingClientRect(),cx=r.left+r.width/2,R=Math.max(90,r.width*1.1),d=Math.abs(e.clientX-cx);
        if(d<R){const f=1-d/R;s.v+=vx*f*26;s.tv+=Math.abs(vx)*f*30}
      });
    }
  }
  lastX=e.clientX;lastT=now;
});

/* ---------- ripple (decaying cloth displacement) ---------- */
const ripState={R:null,F:null};
function ripple(host,k,amp,dur){
  if(REDUCED)return;
  const disp=$("disp"+k),turb=$("turb"+k),t0=performance.now();
  if(ripState[k]&&ripState[k].host!==host)ripState[k].host.classList.remove("rip");
  host.classList.add("rip");ripState[k]={host,t0,amp,dur,disp,turb};
}
function stepRipple(k,now){
  const s=ripState[k];if(!s)return;
  const p=(now-s.t0)/s.dur;
  if(p>=1){s.disp.setAttribute("scale","0");s.host.classList.remove("rip");ripState[k]=null;return}
  const env=Math.sin(Math.min(1,p*6)*Math.PI/2)*Math.pow(1-p,1.6);
  s.disp.setAttribute("scale",(s.amp*env).toFixed(2));
  const by=(k==="R"?0.022:0.018)+0.004*Math.sin(now/140);
  s.turb.setAttribute("baseFrequency",`${k==="R"?0.006:0.005} ${by.toFixed(4)}`);
}

/* ---------- focus view ---------- */
const F={a:0,v:0,rx:0,ry:0,tx:0,ty:0};
function kick(v){if(!REDUCED)F.v+=v}
function renderTags(p){
  const f=FAM[p.fam];
  const html=f.items.map((q,i)=>`<button class="tag${q.id===p.id?" on":""}" data-id="${q.id}" style="--c:${q.c};--t:${q.t};--trim:${q.trim||"transparent"};--str:${[34,52,40,58,46][i%5]}px" aria-pressed="${q.id===p.id}" aria-label="${q.tag}"><i><em>${q.tag}</em></i></button>`).join("");
  $("tags").innerHTML=html;$("tagsM").innerHTML=html;
  document.querySelectorAll(".tag").forEach(b=>b.addEventListener("click",()=>swapColour(b.dataset.id)));
}
function setInfo(p){
  const f=FAM[p.fam];
  $("ftitle").textContent=p.name;
  $("fprice").innerHTML=`<span>${f.price}</span><s>${f.was}</s><span class="off">${f.off}</span>`;
  $("fshop").href=`https://drapesociety.com/products/${p.url}`;
  document.querySelectorAll(".tag").forEach(b=>{const on=b.dataset.id===p.id;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
}
function setGarment(id){
  $("imgFront").src=$("imgBack").src=src(id);
  setMask($("shFront"),id);setMask($("shBack"),id);
}
const ease=t=>1-Math.pow(1-t,3);
function tween(dur,fn,done){const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/dur);fn(ease(p));p<1?requestAnimationFrame(f):done&&done()})(t0)}

function openPiece(el){
  if(busy||current)return;busy=true;
  setHot(el);
  const p=all[el.dataset.id];current=p;isBack=false;
  $("fflip").style.transition="none";$("fflip").classList.remove("back");void $("fflip").offsetWidth;$("fflip").style.transition="";
  $("bFront").setAttribute("aria-pressed","true");$("bBack").setAttribute("aria-pressed","false");
  setGarment(p.id);renderTags(p);setInfo(p);
  F.a=0;F.v=0;F.rx=F.ry=F.tx=F.ty=0;
  focus.hidden=false;
  fpiece.style.transform="none";$("fswing").style.transform="none";$("ftilt").style.transform="none";
  const go=()=>{
    const from=el.querySelector(".cloth").getBoundingClientRect(),to=$("imgFront").getBoundingClientRect();
    const s=from.width/to.width,dx=from.left-to.left,dy=from.top-to.top;
    $("tags").style.transition="none";$("tags").style.opacity=0;
    el.style.visibility="hidden";
    app.classList.add("focused");
    tween(820,k=>{fpiece.style.transform=`translate(${dx*(1-k)}px,${dy*(1-k)}px) scale(${s+(1-s)*k})`},()=>{
      fpiece.style.transform="none";
      $("tags").style.transition="opacity .4s";$("tags").style.opacity=1;
      kick(-28);ripple(fpiece,"F",12,1300);busy=false;
      if(pendingClose){pendingClose=false;closePiece()}
    });
  };
  const im=$("imgFront");im.complete&&im.naturalWidth?go():im.addEventListener("load",go,{once:true});
}
function closePiece(){
  if(!current)return;
  if(busy){pendingClose=true;return}
  busy=true;pendingClose=false;
  const target=items.find(x=>x.dataset.id===current.id)||items[0];
  items.forEach(x=>x.style.visibility="");target.style.visibility="hidden";
  isBack=false;$("fflip").classList.remove("back");
  $("tags").style.opacity=0;
  app.classList.remove("focused");
  setHot(target); // land facing front, then turn back into the rail
  const base=$("imgFront").getBoundingClientRect();
  tween(720,k=>{
    const to=target.querySelector(".cloth").getBoundingClientRect();
    const s=1+(to.width/base.width-1)*k,dx=(to.left-base.left)*k,dy=(to.top-base.top)*k;
    fpiece.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;
  },()=>{
    target.style.visibility="";focus.hidden=true;fpiece.style.transform="none";current=null;busy=false;
    const ph=phys[items.indexOf(target)];ph.v+=REDUCED?0:-40;
    if(!target.matches(":hover"))setHot(null);
  });
}
$("close").addEventListener("click",closePiece);
focus.addEventListener("click",e=>{if(e.target===focus)closePiece()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePiece()});

/* colour wipe, top to bottom like the reference */
function swapColour(id){
  if(!current||id===current.id||busy)return;busy=true;
  const p=all[id],w=$("wipe"),wi=$("imgWipe");
  wi.src=src(id);setMask($("shWipe"),id);w.classList.toggle("mirror",isBack);
  w.classList.remove("run");void w.offsetWidth;
  current=p;setInfo(p);
  const tg=$("tags");tg.classList.remove("jolt");void tg.offsetWidth;tg.classList.add("jolt");
  const go=()=>{
    w.classList.add("run");kick(isBack?30:-30);ripple(fpiece,"F",14,1200);
    setTimeout(()=>{setGarment(id);
      requestAnimationFrame(()=>{w.classList.remove("run");busy=false;if(pendingClose){pendingClose=false;closePiece()}});
    },790);
  };
  wi.decode?wi.decode().then(go,go):go();
}
function setSide(back){
  if(!current||back===isBack)return;isBack=back;
  $("fflip").classList.toggle("back",back);
  $("bFront").setAttribute("aria-pressed",String(!back));$("bBack").setAttribute("aria-pressed",String(back));
  kick(back?36:-36);setTimeout(()=>ripple(fpiece,"F",10,1000),380);
}
$("bFront").addEventListener("click",()=>setSide(false));
$("bBack").addEventListener("click",()=>setSide(true));
// the hung piece leans toward the cursor
focus.addEventListener("pointermove",e=>{
  if(!current||REDUCED)return;
  const r=$("imgFront").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  F.ty=Math.max(-1,Math.min(1,(e.clientX-cx)/(r.width*1.6)))*11;
  F.tx=-Math.max(-1,Math.min(1,(e.clientY-cy)/(r.height*1.6)))*5;
});
focus.addEventListener("pointerleave",()=>{F.tx=F.ty=0});

/* ---------- one animation loop for every pendulum ---------- */
let prev=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-prev)/1000);prev=now;const T=now/1000;
  for(const s of phys){
    const breeze=REDUCED?0:(Math.sin(T*.9+s.ph)*.55+Math.sin(T*.37+s.ph2)*.45)*5;
    s.v+=(-26*s.a-2.6*s.v+breeze)*dt; s.a+=s.v*dt;
    s.tv+=(-18*s.t-2.2*s.tv+breeze*.8)*dt; s.t+=s.tv*dt;
    s.a=Math.max(-9,Math.min(9,s.a)); s.t=Math.max(-12,Math.min(22,s.t)); // never turns past side-on
    s.sw.style.transform=`rotate(${s.a.toFixed(3)}deg)`;
    s.tw.style.transform=`rotateY(${s.t.toFixed(3)}deg)`;
  }
  if(current){
    const breeze=REDUCED?0:Math.sin(T*.8)*1.6;
    F.v+=(-22*F.a-2.4*F.v+breeze)*dt;F.a+=F.v*dt;F.a=Math.max(-10,Math.min(10,F.a));
    F.rx+=(F.tx-F.rx)*Math.min(1,dt*5);F.ry+=(F.ty-F.ry)*Math.min(1,dt*5);
    $("fswing").style.transform=`rotate(${F.a.toFixed(3)}deg)`;
    $("ftilt").style.transform=`rotateX(${F.rx.toFixed(3)}deg) rotateY(${F.ry.toFixed(3)}deg)`;
  }
  stepRipple("R",now);stepRipple("F",now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


/* masthead: cycle the campaign lines, replay the speed streaks on hover */
(function(){
  const lines=["Move Different","Built for the Unordinary","Not Made to Blend In","The Street Is Your Runway"];
  const el=$("tagw");let i=0;
  if(!REDUCED)setInterval(()=>{
    el.classList.add("out");
    setTimeout(()=>{i=(i+1)%lines.length;el.textContent=lines[i];el.classList.remove("out");el.classList.add("pre");void el.offsetWidth;el.classList.remove("pre")},450);
  },2800);
  const st=$("streaks");
  $("mark").addEventListener("pointerenter",()=>{if(REDUCED)return;st.classList.remove("go");void st.getBoundingClientRect();st.classList.add("go")});
})();

/* ticker: the brand's own campaign lines */
const lines=["Move Different","Built for the Unordinary","Not Made to Blend In","The Street Is Your Runway","New Drops Live","Made in Indore"];
const run=lines.map((l,i)=>`<span class="${i===4?"red":""}">${l}</span>`).join("");
$("track").innerHTML=run+run+run+run;
</script>
